<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090f1c" />
    <meta name="description" content="FastQuiz — interactive Python and FastAPI backend quizzes." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>FastQuiz — Backend Challenge</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('fastquiz_theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
          document.querySelector('meta[name="theme-color"]').content = savedTheme === 'light' ? '#f5f7fb' : '#090f1c';
        }
      } catch {
        // The default dark theme remains available when storage is disabled.
      }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
